ais ·</text><text x="491" y="532" fill="#475569" font-size="11">distintivos</text></g><g><rect x="915" y="465" width="250" height="94" rx="0" fill="#f4f8fc" stroke="#a6b9cb" stroke-width="1.4"/><text x="931" y="490" fill="#172033" font-size="14" font-weight="400">Panorama e áudio</text><text x="931" y="517" fill="#475569" font-size="11">Visor de 360° · giroscópio ·</text><text x="931" y="532" fill="#475569" font-size="11">audioguia</text></g><g><rect x="348" y="279" width="64" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="380" y="291" text-anchor="middle" font-size="10" fill="#475569">Interações</text></g><g><rect x="325.1714285714286" y="179" width="136.8" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="393.57142857142856" y="191" text-anchor="middle" font-size="10" fill="#475569">Localização / orientação</text></g><g><rect x="646.2" y="165" width="131.60000000000002" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="712" y="177" text-anchor="middle" font-size="10" fill="#475569">Sincronizar com ligação</text></g><g><rect x="743.8" y="333" width="152.4" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="820" y="345" text-anchor="middle" font-size="10" fill="#475569">Descarregar / ler ficheiros</text></g><g><rect x="153.8" y="409" width="126.4" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="217" y="421" text-anchor="middle" font-size="10" fill="#475569">Pedir percurso pedonal</text></g><g><rect x="611.4" y="396" width="121.2" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="672" y="408" text-anchor="middle" font-size="10" fill="#475569">Distância e progresso</text></g><g><rect x="1058.4" y="395" width="95.2" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="1106" y="407" text-anchor="middle" font-size="10" fill="#475569">Multimédia local</text></g><g><rect x="856.8" y="409" width="126.4" height="18" rx="3" fill="#fff" fill-opacity=".96"/><text x="920" y="421" text-anchor="middle" font-siz